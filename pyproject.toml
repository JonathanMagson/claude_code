[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vegmon"
version = "0.1.0"
description = "Land clearing detection from Sentinel-1 and Sentinel-2, with post-clearing regrowth monitoring"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "remote sensing", "sentinel-1", "sentinel-2", "land clearing",
    "vegetation monitoring", "change detection", "regrowth", "SAR",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
geo = ["rasterio>=1.3", "geopandas>=0.14", "shapely>=2.0", "pyproj>=3.5", "pandas>=2.0"]
stac = ["pystac-client>=0.7", "odc-stac>=0.3", "xarray>=2023.1", "planetary-computer>=1.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
all = ["vegmon[geo,stac,dev]"]

[project.scripts]
vegmon = "vegmon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that generate a full-size synthetic datacube",
    "network: tests that need a reachable STAC catalogue",
]
filterwarnings = ["error::RuntimeWarning"]
